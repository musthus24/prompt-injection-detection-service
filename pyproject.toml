[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-injection-detector"
version = "0.1.0"
description = "Prompt injection detection for LLM-powered applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["llm", "security", "prompt-injection", "ai-safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
service = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "pydantic>=2.0",
    "python-jose[cryptography]",
    "python-dotenv>=1.0",
    "python-json-logger",
    "prometheus-client",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.24",
    "black>=24.0",
    "ruff>=0.4",
]

[project.urls]
Repository = "https://github.com/mustafahussain/prompt-injection-detection-service"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_injection_detector"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
